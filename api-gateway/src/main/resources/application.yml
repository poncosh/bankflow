server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: account-service-route
              uri: lb://account-service
              predicates:
                - Path=/api/accounts,/api/accounts/**
              filters:
                - StripPrefix=1
                - PrefixPath=/api/v1
            - id: transfer-service-route
              uri: lb://transfer-service
              predicates:
                - Path=/api/transfers,/api/transfers/**
              filters:
                - StripPrefix=1
                - PrefixPath=/api/v1
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,ratelimiters,ratelimiterevents
  endpoint:
    health:
      show-details: always
    gateway:
      access: read-only
bankflow:
  gateway:
    transfer-rate-limit:
      name: transferApi
      path: /api/transfers
      error-code: RATE_LIMIT_EXCEEDED
      message: Transfer request rate limit exceeded
resilience4j:
  ratelimiter:
    instances:
      transferApi:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0
